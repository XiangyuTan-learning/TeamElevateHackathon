<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" role="img" aria-label="LifeLink">
  <title>LifeLink</title>
  <rect width="200" height="56" rx="10" fill="#0f3d33"/>
  <circle cx="32" cy="28" r="11" fill="none" stroke="#f2b400" stroke-width="4.5"/>
  <circle cx="45" cy="28" r="11" fill="none" stroke="#ffffff" stroke-width="4.5"/>
  <!-- the left ring passes over the right ring where they meet, so they read as linked -->
  <path d="M38.5 18.9 A11 11 0 0 1 38.5 37.1" fill="none" stroke="#f2b400" stroke-width="4.5"/>
  <text x="68" y="37" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="700" fill="#ffffff">LifeLink</text>
</svg>
